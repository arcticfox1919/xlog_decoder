name: xlog_web
description: Jaspr web client for the Xlog decoding service.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  jaspr: 0.23.5
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.6.0
  build_web_compilers: ^4.2.0
  jaspr_builder: 0.23.5
  jaspr_cli: 0.23.5
  jaspr_test: 0.23.5
  lints: ^6.1.0
  test: ^1.26.2

jaspr:
  mode: client
  styles: standalone
